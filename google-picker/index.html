<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://apis.google.com https://www.gstatic.com https://ssl.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://www.gstatic.com https://ssl.gstatic.com; font-src https://fonts.gstatic.com; img-src 'self' https: data:; frame-src https://docs.google.com https://drive.google.com https://accounts.google.com https://content.googleapis.com; connect-src https://*.googleapis.com https://*.google.com; base-uri 'none'; form-action 'none'">
    <title>Choose Files · AICoven Local</title>
    <style>
        :root { color-scheme: light dark; --ink: #1f1d1a; --quiet: #6b665e; --page: #f6f3ee; --card: #fffdf9; --line: #e2ddd4; --water: #2f6f8f; --rust: #a4472b; }
        @media (prefers-color-scheme: dark) { :root { --ink: #ece8e1; --quiet: #a39d93; --page: #171614; --card: #201f1c; --line: #34322e; --water: #7fb3cc; --rust: #e08a6c; } }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--page); color: var(--ink); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        main { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 28px 24px; text-align: center; }
        h1 { font-size: 19px; margin: 0 0 8px; }
        p { margin: 0 0 18px; color: var(--quiet); }
        p.problem { color: var(--rust); }
        button, a.button { display: inline-block; font: inherit; font-weight: 600; padding: 9px 18px; border-radius: 9px; border: 0; background: var(--water); color: #fff; text-decoration: none; cursor: pointer; }
        .spinner { width: 28px; height: 28px; margin: 0 auto 14px; border: 3px solid var(--line); border-top-color: var(--water); border-radius: 50%; animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <main aria-live="polite">
        <div id="spinner" class="spinner" aria-hidden="true"></div>
        <h1 id="title">Opening Google Drive…</h1>
        <p id="detail">Choose the files AICoven Local may open.</p>
        <button id="again" type="button" hidden>Choose Files</button>
        <a id="back" class="button" hidden>Return to AICoven</a>
    </main>
    <script src="picker.js"></script>
</body>
</html>
