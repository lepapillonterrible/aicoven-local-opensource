# CI workflow for AICoven Local
# Runs on pull requests and pushes to main/dev branches
# Executes linting, building, and testing

name: CI

on:
  # Run on all pull requests
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'swift/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
      - '.swiftformat'
      - '.swiftlint.yml'

  # Run on pushes to main branches
  push:
    branches:
      - main
      - dev
    paths:
      - 'swift/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
      - '.swiftformat'
      - '.swiftlint.yml'

  # Allow manual triggering
  workflow_dispatch:

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-test:
    name: Lint, Build & Test
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode 26.2 (Swift tools >= 6.1)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Show Xcode & Swift versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Install SwiftFormat
        run: brew install swiftformat

      - name: Run SwiftFormat (check mode)
        run: |
          # Lint without the default disk cache so CI matches a fresh checkout (local
          # caches can otherwise hide docComments / rule updates until --cache ignore).
          swiftformat swift/AICoven --lint --cache ignore || {
            echo "::error::SwiftFormat found formatting issues. Run 'swiftformat swift/AICoven --cache ignore' locally, then verify with 'swiftformat swift/AICoven --lint --cache ignore'."
            exit 1
          }

      - name: Run SwiftLint
        run: swiftlint --strict

      - name: Create placeholder GoogleService-Info.plist
        run: |
          # Create a placeholder Firebase config for CI builds.
          # The app code detects placeholder values and skips Firebase initialization.
          cat > swift/AICoven/GoogleService-Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>API_KEY</key>
            <string>placeholder</string>
            <key>GCM_SENDER_ID</key>
            <string>000000000000</string>
            <key>PLIST_VERSION</key>
            <string>1</string>
            <key>BUNDLE_ID</key>
            <string>com.aicoven.local</string>
            <key>PROJECT_ID</key>
            <string>placeholder</string>
            <key>STORAGE_BUCKET</key>
            <string>placeholder.appspot.com</string>
            <key>IS_ADS_ENABLED</key>
            <false/>
            <key>IS_ANALYTICS_ENABLED</key>
            <false/>
            <key>IS_APPINVITE_ENABLED</key>
            <false/>
            <key>IS_GCM_ENABLED</key>
            <false/>
            <key>IS_SIGNIN_ENABLED</key>
            <false/>
            <key>GOOGLE_APP_ID</key>
            <string>1:000000000000:ios:placeholder</string>
          </dict>
          </plist>
          EOF

      - name: Resolve Swift Package dependencies (fresh)
        run: |
          rm -f "swift/AICoven/AICoven Local.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
          xcodebuild \
            -project "swift/AICoven/AICoven Local.xcodeproj" \
            -scheme AICoven \
            -resolvePackageDependencies

      - name: Build AICoven (Debug)
        run: |
          # Build the project without code signing for CI
          xcodebuild \
            -project "swift/AICoven/AICoven Local.xcodeproj" \
            -scheme AICoven \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run Tests
        run: |
          # Run tests if the test plan has configured targets
          PLAN_PATH="swift/AICoven/AICovenTests/AICoven.xctestplan"
          if [[ -f "$PLAN_PATH" && $(grep -c '"target"' "$PLAN_PATH") -gt 0 ]]; then
            echo "Running AICoven tests..."
            xcodebuild \
              -project "swift/AICoven/AICoven Local.xcodeproj" \
              -scheme AICoven \
              -configuration Debug \
              -destination 'platform=macOS' \
              CODE_SIGNING_ALLOWED=NO \
              test
          else
            echo "No XCTest targets configured in test plan; skipping tests."
          fi
